<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- TECHNIQUE DEMO, family "Bold & graphic" (poster blocks). Study the moves, don't copy the
         layout: giant word slam + hard word swaps, a colour-block wipe, a product card in a thick
         outline with a hard offset shadow, spring stickers, a count-up stat with a scribble
         underline, a tile slam out. ~6 s. Brand variables only. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--brand-primary); color: var(--brand-ink); font-family: var(--font-display); }
        .bo-scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        #bo-a { background: var(--brand-primary); }
        .bo-word { position: absolute; font-weight: 800; font-size: 330px; letter-spacing: -0.06em; line-height: 0.9; color: var(--brand-on-primary); text-transform: uppercase; }
        #bo-b { background: var(--brand-secondary); }
        #bo-card { position: relative; width: 820px; padding: 34px 38px; border-radius: 26px; background: var(--brand-paper); border: 5px solid var(--brand-ink); box-shadow: 18px 18px 0 var(--brand-ink); font-family: var(--font-text); }
        #bo-card h4 { font: 800 34px var(--font-display); letter-spacing: -0.02em; }
        .bo-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 3px solid var(--brand-ink); font-size: 22px; font-weight: 600; }
        .bo-pill { margin-top: 22px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--brand-primary); color: var(--brand-on-primary); font: 800 24px var(--font-display); border: 4px solid var(--brand-ink); }
        .bo-sticker { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 5px solid var(--brand-ink); font: 800 30px var(--font-display); }
        #bo-s1 { left: 470px; top: 170px; width: 170px; height: 170px; background: var(--brand-paper); }
        #bo-s2 { right: 430px; bottom: 150px; width: 150px; height: 150px; background: var(--brand-primary); color: var(--brand-on-primary); }
        #bo-star { position: absolute; right: 360px; top: 150px; width: 150px; height: 150px; }
        #bo-star path { fill: var(--brand-paper); stroke: var(--brand-ink); stroke-width: 5; }
        #bo-c { background: var(--brand-ink); color: var(--brand-paper); flex-direction: column; }
        #bo-stat { font-weight: 800; font-size: 300px; letter-spacing: -0.05em; line-height: 1; }
        #bo-stat span { color: var(--brand-primary); }
        #bo-scrib { width: 760px; height: 60px; }
        #bo-scrib path { stroke: var(--brand-secondary); stroke-width: 12; fill: none; stroke-linecap: round; }
        .bo-tile { position: absolute; width: 50%; height: 50%; }
      </style>
      <div id="root" data-composition-id="ex-bold" data-width="1920" data-height="1080">
        <div id="bo-a" class="bo-scene"><div id="bo-w1" class="bo-word">Ship</div><div id="bo-w2" class="bo-word">faster.</div></div>
        <div id="bo-b" class="bo-scene">
          <div id="bo-card">
            <h4>Invoice #0142</h4>
            <div class="bo-row"><span>UI design</span><span>720.00</span></div>
            <div class="bo-row"><span>Design review</span><span>360.00</span></div>
            <div class="bo-pill">Send invoice</div>
          </div>
          <div id="bo-s1" class="bo-sticker">NEW</div>
          <div id="bo-s2" class="bo-sticker">AI</div>
          <svg id="bo-star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 61 36 95 38 68 58 78 92 50 72 22 92 32 58 5 38 39 36z" /></svg>
        </div>
        <div id="bo-c" class="bo-scene">
          <div id="bo-stat"><b id="bo-num">0</b><span>× faster</span></div>
          <svg id="bo-scrib" viewBox="0 0 760 60" aria-hidden="true"><path id="bo-scrib-path" d="M10 40 C 120 10, 220 55, 330 30 S 540 15, 750 38" /></svg>
        </div>
        <div id="bo-tiles">
          <div class="bo-tile" style="left: 0; top: 0; background: var(--brand-primary)"></div>
          <div class="bo-tile" style="left: 50%; top: 0; background: var(--brand-secondary)"></div>
          <div class="bo-tile" style="left: 0; top: 50%; background: var(--brand-paper)"></div>
          <div class="bo-tile" style="left: 50%; top: 50%; background: var(--brand-ink)"></div>
        </div>
      </div>
      <script>
        (function () {
          document.fonts.ready.then(function () {
            const FX = window.FX;
            const tl = gsap.timeline({ paused: true });
            // A. word slam, then a hard swap on the beat
            tl.fromTo("#bo-w1", { scale: 2.4, rotation: -8, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.42, ease: "back.out(2.2)" }, 0.05);
            tl.set("#bo-w1", { opacity: 0 }, 0.75);
            tl.fromTo("#bo-w2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.75);
            tl.fromTo("#bo-a", { scale: 1 }, { scale: 1.06, duration: 1.3, ease: "none" }, 0);
            // B. colour block wipes in from the left (hard, fast)
            tl.fromTo("#bo-b", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "expo.out" }, 1.3);
            tl.fromTo("#bo-card", { y: 700, rotation: 8 }, { y: 0, rotation: -4, duration: 0.7, ease: "back.out(1.6)" }, 1.4);
            tl.to("#bo-card", { rotation: -2, y: -10, duration: 1.6, ease: "sine.inOut" }, 2.1);
            [["#bo-s1", 1.85, -14], ["#bo-s2", 2.0, 12]].forEach(([s, t, r]) => {
              tl.fromTo(s, { scale: 0, rotation: r * 3 }, { scale: 1, rotation: r, duration: 0.5, ease: "back.out(3)" }, t);
            });
            tl.fromTo("#bo-star", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, 2.15);
            tl.to("#bo-star", { rotation: 40, duration: 1.4, ease: "none" }, 2.65);
            // C. hard cut to the stat
            tl.fromTo("#bo-c", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.7);
            FX.countUp(tl, document.getElementById("bo-num"), 0, 3, 3.75, 0.5, (n) => String(Math.round(n)), "power3.out");
            tl.fromTo("#bo-stat", { scale: 1.3 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 3.7);
            FX.drawPath(tl, document.getElementById("bo-scrib-path"), 4.2, 0.45, "power2.out");
            // exit: four colour tiles slam in
            document.querySelectorAll(".bo-tile").forEach((t, i) => tl.fromTo(t, { scale: 0 }, { scale: 1.01, duration: 0.3, ease: "back.out(1.4)", transformOrigin: "50% 50%" }, 5.35 + i * 0.06));
            window.__timelines["ex-bold"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
