<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- TECHNIQUE DEMO, family "Clean & editorial" (Swiss grid). Study the moves, don't copy the
         layout: grid lines draw on, masked line-by-line headline, flat product card sliding along
         the grid, a drawn annotation, a colour-panel wipe out. ~6 s. Brand variables only. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--brand-paper); color: var(--brand-ink); font-family: var(--font-text); }
        #ed-stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #ed-grid { position: absolute; inset: 0; width: 100%; height: 100%; }
        #ed-grid line { stroke: var(--brand-line); stroke-width: 1.5; }
        #ed-label { position: absolute; left: 120px; top: 96px; font: 500 22px var(--font-mono); letter-spacing: 0.04em; color: var(--brand-muted); }
        #ed-head { position: absolute; left: 112px; top: 250px; font: 600 156px/1.02 var(--font-display); letter-spacing: -0.045em; }
        .ed-l { display: block; overflow: hidden; padding-bottom: 0.08em; }
        .ed-l > span { display: block; }
        .ed-l.acc > span { color: var(--brand-primary); }
        #ed-card { position: absolute; left: 1020px; top: 300px; width: 760px; padding: 30px 34px; border-radius: 20px; background: var(--brand-paper); border: 1.5px solid var(--brand-line); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08); }
        #ed-card h4 { font: 700 26px var(--font-display); }
        .ed-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--brand-line); font-size: 18px; }
        .ed-row b { font-weight: 600; }
        #ed-tag { position: absolute; left: 1020px; top: 222px; display: flex; align-items: center; gap: 12px; font: 500 20px var(--font-mono); color: var(--brand-primary); }
        #ed-tag i { width: 12px; height: 12px; border-radius: 50%; background: var(--brand-primary); }
        #ed-note { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        #ed-note path { stroke: var(--brand-primary); stroke-width: 2; fill: none; }
        #ed-wipe { position: absolute; inset: 0; background: var(--brand-primary); }
      </style>
      <div id="root" data-composition-id="ex-editorial" data-width="1920" data-height="1080">
        <div id="ed-stage">
          <svg id="ed-grid" viewBox="0 0 1920 1080" aria-hidden="true">
            <line x1="120" y1="160" x2="1800" y2="160" /><line x1="120" y1="940" x2="1800" y2="940" />
            <line x1="120" y1="60" x2="120" y2="1020" /><line x1="960" y1="60" x2="960" y2="1020" /><line x1="1800" y1="60" x2="1800" y2="1020" />
          </svg>
          <div id="ed-label">01 / INVOICING</div>
          <div id="ed-head">
            <span class="ed-l"><span>Invoices</span></span>
            <span class="ed-l"><span>that write</span></span>
            <span class="ed-l acc"><span>themselves.</span></span>
          </div>
          <div id="ed-tag"><i></i>Drafted in 4 s</div>
          <div id="ed-card">
            <h4>Invoice #0142</h4>
            <div class="ed-row"><span>UI design, 8 h</span><b>720.00</b></div>
            <div class="ed-row"><span>Design review, 4 h</span><b>360.00</b></div>
            <div class="ed-row" style="border: 0"><span>Total</span><b id="ed-total">1,080.00</b></div>
          </div>
          <svg id="ed-note" viewBox="0 0 1920 1080" aria-hidden="true"><path id="ed-note-path" d="M1028 236 C 980 236, 960 300, 1020 330" /></svg>
        </div>
        <div id="ed-wipe"></div>
      </div>
      <script>
        (function () {
          document.fonts.ready.then(function () {
            const FX = window.FX;
            const tl = gsap.timeline({ paused: true });
            // calm, constant camera: the editorial family barely moves
            tl.fromTo("#ed-stage", { scale: 1 }, { scale: 1.035, duration: 6, ease: "none" }, 0);
            document.querySelectorAll("#ed-grid line").forEach((l, i) => FX.drawPath(tl, l, 0.05 + i * 0.07, 0.7, "power2.inOut"));
            tl.fromTo("#ed-label", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.4);
            document.querySelectorAll(".ed-l > span").forEach((s, i) => {
              tl.fromTo(s, { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.55 + i * 0.09);
            });
            // product card arrives along the grid, flat and precise
            tl.fromTo("#ed-card", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 1.9);
            document.querySelectorAll(".ed-row").forEach((r, i) => tl.fromTo(r, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.25 + i * 0.12));
            FX.countUp(tl, document.getElementById("ed-total"), 0, 1080, 2.6, 0.7, (n) => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
            FX.drawPath(tl, document.getElementById("ed-note-path"), 3.2, 0.5);
            tl.fromTo("#ed-tag", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.5);
            // exit: a brand-colour panel wipes up (the next scene can start on that colour)
            tl.set("#ed-wipe", { clipPath: "inset(100% 0 0 0)" }, 0);
            FX.maskReveal(tl, "#ed-wipe", 5.3, 0.6, "up", "power3.inOut");
            window.__timelines["ex-editorial"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
